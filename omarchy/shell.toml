[bar]
background = "#000000"
background-alpha = 0.0
text = "#b7bdf8"
active = "#c6a0f6"
scale-with-font = false
size-horizontal = 30
size-vertical = 30

[font]
base-size = 14
body = 18
icon = 18
icon-large = 18

# Full-screen dim behind overlays. 0 leaves the desktop unchanged.
# Menu also covers clipboard, emojis, and reminders.
[menu]
scrim-alpha = 0.0

[launcher]
scrim-alpha = 0.0

[polkit]
scrim-alpha = 0.0

[image-picker]
scrim-alpha = 0.0
