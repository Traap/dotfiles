[main]
# Inlined to match Ghostty's built-in TokyoNight Night theme, not the Omarchy theme file.
term=xterm-256color
font=JetBrainsMono Nerd Font:size=12.5:fontfeatures=liga,Hack Nerd Font:size=12.5
pad=2x2
initial-window-mode=windowed
workers=0

[scrollback]
lines=10000
multiplier=0.95

[cursor]
style=block
blink=no

[colors-dark]
foreground=c0caf5
background=1a1b26
alpha=0.8
blur=no

selection-foreground=c0caf5
selection-background=283457

cursor=1a1b26 ff99ff

regular0=15161e
regular1=f7768e
regular2=9ece6a
regular3=e0af68
regular4=7aa2f7
regular5=bb9af7
regular6=7dcfff
regular7=a9b1d6

bright0=414868
bright1=f7768e
bright2=9ece6a
bright3=e0af68
bright4=7aa2f7
bright5=bb9af7
bright6=7dcfff
bright7=c0caf5

[key-bindings]
clipboard-copy=Control+Insert Control+Shift+c XF86Copy
primary-paste=none
clipboard-paste=Shift+Insert Control+Shift+v XF86Paste

[text-bindings]
# Send Shift+Return as CSI-u so TUIs can distinguish it from Return.
\x1b[13;2u=Shift+Return
# Send Alt+Shift+Return as CSI-u so tmux can match M-S-Enter.
\x1b[13;4u=Mod1+Shift+Return
