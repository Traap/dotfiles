[main]
font=JetBrainsMono Nerd Font:size=12.5, Hack Nerd Font:size=12.5
dpi-aware=yes
include=/usr/share/foot/themes/tokyonight-night

[tweak]
font-monospace-warn=no

[colors-dark]
alpha=0.8
cursor=1a1b26 ff99ff
selection-foreground=c0caf5
selection-background=283457

[text-bindings]
# Send Shift+Return as CSI-u so TUIs can distinguish it from Return.
\x1b[13;2u=Shift+Return
# Send Alt+Shift+Return as CSI-u so tmux can match M-S-Enter.
\x1b[13;4u=Mod1+Shift+Return

[scrollback]
multiplier=7.0
